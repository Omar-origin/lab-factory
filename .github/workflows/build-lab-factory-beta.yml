name: Build Lab Factory Beta

on:
  workflow_dispatch:
  push:
    paths:
      - "mcp/lab-skill-factory/**"
      - "skills/lab-skill-factory/**"
      - ".github/workflows/build-lab-factory-beta.yml"

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-14
            artifact: lab-factory-macos-arm64
          - name: windows-x64
            os: windows-latest
            artifact: lab-factory-windows-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime dependencies
        run: python -m pip install -r mcp/lab-skill-factory/runtime-requirements.txt

      - name: Test v1 fill-map regression suite
        run: python mcp/lab-skill-factory/scripts/run_beta_smoke_tests.py

      - name: Test v2 deterministic engine
        run: python mcp/lab-skill-factory/scripts/run_v2_tests.py

      - name: Test v2.1 report autopilot
        run: python mcp/lab-skill-factory/scripts/run_autopilot_tests.py

      - name: Test native media and file-bound quality gates
        run: python mcp/lab-skill-factory/scripts/run_native_tests.py

      - name: Test installer and activation
        run: python mcp/lab-skill-factory/scripts/test_install_and_activation.py

      - name: Test commercial flow
        run: python mcp/lab-skill-factory/scripts/test_commercial_flow.py

      - name: Test online license control
        run: python mcp/lab-skill-factory/scripts/test_online_license_control.py

      - name: Build macOS binary
        if: runner.os == 'macOS'
        run: bash mcp/lab-skill-factory/build/build_macos.sh

      - name: Build Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\mcp\lab-skill-factory\build\build_windows.ps1

      - name: Install Inno Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\mcp\lab-skill-factory\build\build_windows_installer.ps1 -SkipBinaryBuild -Version "1.0.0-beta.${{ github.run_number }}"

      - name: Smoke test macOS binary
        if: runner.os == 'macOS'
        run: |
          ./mcp/lab-skill-factory/dist/macos/lab-factory status
          ./mcp/lab-skill-factory/dist/macos/lab-factory check-runtime
          ./mcp/lab-skill-factory/dist/macos/lab-factory mcp-smoke
          python3 mcp/lab-skill-factory/scripts/smoke_mcp_stdio.py ./mcp/lab-skill-factory/dist/macos/lab-factory serve-mcp
          install_test_dir="$(mktemp -d)"
          install_config="$install_test_dir/codex-config.toml"
          ./mcp/lab-skill-factory/dist/macos/lab-factory install --target codex --binary "$(pwd)/mcp/lab-skill-factory/dist/macos/lab-factory" --codex-config "$install_config" --purchase-url https://example.test/purchase --support-email support@example.test --feedback-email feedback@example.test
          grep -q "\[mcp_servers.lab-skill-factory\]" "$install_config"
          grep -q "LAB_FACTORY_PRODUCT_ID" "$install_config"
          if grep -q "_MEI" "$install_config"; then
            echo "install wrote a PyInstaller temporary _MEI path"
            cat "$install_config"
            exit 1
          fi

      - name: Smoke test Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .\mcp\lab-skill-factory\dist\windows\lab-factory.exe status
          .\mcp\lab-skill-factory\dist\windows\lab-factory.exe check-runtime
          .\mcp\lab-skill-factory\dist\windows\lab-factory.exe mcp-smoke
          python .\mcp\lab-skill-factory\scripts\smoke_mcp_stdio.py .\mcp\lab-skill-factory\dist\windows\lab-factory.exe serve-mcp
          $binaryPath = (Resolve-Path .\mcp\lab-skill-factory\dist\windows\lab-factory.exe).Path
          $codexConfig = Join-Path $env:RUNNER_TEMP "lab-factory-codex-config.toml"
          .\mcp\lab-skill-factory\dist\windows\lab-factory.exe install --target codex --binary $binaryPath --codex-config $codexConfig --purchase-url https://example.test/purchase --support-email support@example.test --feedback-email feedback@example.test
          if (-not (Select-String -Path $codexConfig -Pattern "\[mcp_servers\.lab-skill-factory\]" -Quiet)) {
            Get-Content $codexConfig
            throw "Codex MCP section was not written"
          }
          if (-not (Select-String -Path $codexConfig -Pattern "LAB_FACTORY_PRODUCT_ID" -Quiet)) {
            Get-Content $codexConfig
            throw "Codex MCP env was not written"
          }
          if (Select-String -Path $codexConfig -Pattern "_MEI" -Quiet) {
            Get-Content $codexConfig
            throw "install wrote a PyInstaller temporary _MEI path"
          }

      - name: Smoke test Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem .\mcp\lab-skill-factory\dist\windows\installer\*.exe | Select-Object -First 1
          $installDir = Join-Path $env:RUNNER_TEMP "lab-factory-install"
          $setupLog = Join-Path $env:RUNNER_TEMP "lab-factory-install.log"
          & $installer.FullName /VERYSILENT /SUPPRESSMSGBOXES /NORESTART "/DIR=$installDir" "/LOG=$setupLog"
          if ($LASTEXITCODE -ne 0) {
            if (Test-Path $setupLog) { Get-Content $setupLog }
            exit $LASTEXITCODE
          }
          $installedExe = Join-Path $installDir "lab-factory.exe"
          if (-not (Test-Path $installedExe)) {
            if (Test-Path $setupLog) { Get-Content $setupLog }
            if (Test-Path $installDir) { Get-ChildItem $installDir -Recurse | Format-Table -AutoSize }
            throw "Installed executable not found: $installedExe"
          }
          $agentGuide = Join-Path $installDir "docs\AGENT_MCP_DEPLOYMENT.md"
          if (-not (Test-Path $agentGuide)) {
            if (Test-Path $installDir) { Get-ChildItem $installDir -Recurse | Format-Table -AutoSize }
            throw "Agent deployment guide not found: $agentGuide"
          }
          $agentQuickInstall = Join-Path $installDir "INSTALL_FOR_AGENT.md"
          if (-not (Test-Path $agentQuickInstall)) {
            if (Test-Path $installDir) { Get-ChildItem $installDir -Recurse | Format-Table -AutoSize }
            throw "Agent quick install guide not found: $agentQuickInstall"
          }
          $userGuide = Join-Path $installDir "USER_GUIDE.md"
          if (-not (Test-Path $userGuide)) {
            if (Test-Path $installDir) { Get-ChildItem $installDir -Recurse | Format-Table -AutoSize }
            throw "User guide not found: $userGuide"
          }
          & $installedExe status
          & $installedExe check-runtime
          & $installedExe mcp-smoke
          python .\mcp\lab-skill-factory\scripts\smoke_mcp_stdio.py $installedExe serve-mcp
          $installedCodexConfig = Join-Path $env:RUNNER_TEMP "lab-factory-installed-codex-config.toml"
          & $installedExe install --target codex --binary $installedExe --codex-config $installedCodexConfig --purchase-url https://example.test/purchase --support-email support@example.test --feedback-email feedback@example.test
          if (-not (Select-String -Path $installedCodexConfig -Pattern "\[mcp_servers\.lab-skill-factory\]" -Quiet)) {
            Get-Content $installedCodexConfig
            throw "Installed exe did not write Codex MCP section"
          }
          if (-not (Select-String -Path $installedCodexConfig -Pattern "LAB_FACTORY_PRODUCT_ID" -Quiet)) {
            Get-Content $installedCodexConfig
            throw "Installed exe did not write Codex MCP env"
          }
          if (Select-String -Path $installedCodexConfig -Pattern "_MEI" -Quiet) {
            Get-Content $installedCodexConfig
            throw "installed exe wrote a PyInstaller temporary _MEI path"
          }
          $uninstaller = Join-Path $installDir "unins000.exe"
          if (Test-Path $uninstaller) {
            & $uninstaller /VERYSILENT /SUPPRESSMSGBOXES /NORESTART
          }

      - name: Upload macOS artifact
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            mcp/lab-skill-factory/dist/macos/lab-factory
            mcp/lab-skill-factory/INSTALL_FOR_AGENT.md
            mcp/lab-skill-factory/USER_GUIDE.md
            mcp/lab-skill-factory/docs/*.md
            mcp/lab-skill-factory/README.md

      - name: Upload Windows artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            mcp/lab-skill-factory/dist/windows/lab-factory.exe
            mcp/lab-skill-factory/dist/windows/installer/*.exe
            mcp/lab-skill-factory/INSTALL_FOR_AGENT.md
            mcp/lab-skill-factory/USER_GUIDE.md
            mcp/lab-skill-factory/docs/*.md
            mcp/lab-skill-factory/README.md
