name: Build Lab Factory Beta

on:
  workflow_dispatch:
  push:
    paths:
      - "mcp/lab-skill-factory/**"
      - "skills/lab-skill-factory/**"
      - ".github/workflows/build-lab-factory-beta.yml"

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-14
            artifact: lab-factory-macos-arm64
          - name: windows-x64
            os: windows-latest
            artifact: lab-factory-windows-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build macOS binary
        if: runner.os == 'macOS'
        run: bash mcp/lab-skill-factory/build/build_macos.sh

      - name: Build Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\mcp\lab-skill-factory\build\build_windows.ps1

      - name: Install Inno Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\mcp\lab-skill-factory\build\build_windows_installer.ps1 -SkipBinaryBuild -Version "0.1.0-beta.${{ github.run_number }}"

      - name: Smoke test macOS binary
        if: runner.os == 'macOS'
        env:
          LAB_FACTORY_DEV_ALLOW: "1"
        run: |
          ./mcp/lab-skill-factory/dist/macos/lab-factory status
          ./mcp/lab-skill-factory/dist/macos/lab-factory check-runtime

      - name: Smoke test Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          LAB_FACTORY_DEV_ALLOW: "1"
        run: |
          .\mcp\lab-skill-factory\dist\windows\lab-factory.exe status
          .\mcp\lab-skill-factory\dist\windows\lab-factory.exe check-runtime

      - name: Smoke test Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          LAB_FACTORY_DEV_ALLOW: "1"
        run: |
          $installer = Get-ChildItem .\mcp\lab-skill-factory\dist\windows\installer\*.exe | Select-Object -First 1
          $installDir = Join-Path $env:RUNNER_TEMP "lab-factory-install"
          $setupLog = Join-Path $env:RUNNER_TEMP "lab-factory-install.log"
          & $installer.FullName /VERYSILENT /SUPPRESSMSGBOXES /NORESTART "/DIR=$installDir" "/LOG=$setupLog"
          if ($LASTEXITCODE -ne 0) {
            if (Test-Path $setupLog) { Get-Content $setupLog }
            exit $LASTEXITCODE
          }
          $installedExe = Join-Path $installDir "lab-factory.exe"
          if (-not (Test-Path $installedExe)) {
            if (Test-Path $setupLog) { Get-Content $setupLog }
            if (Test-Path $installDir) { Get-ChildItem $installDir -Recurse | Format-Table -AutoSize }
            throw "Installed executable not found: $installedExe"
          }
          & $installedExe status
          & $installedExe check-runtime
          $uninstaller = Join-Path $installDir "unins000.exe"
          if (Test-Path $uninstaller) {
            & $uninstaller /VERYSILENT /SUPPRESSMSGBOXES /NORESTART
          }

      - name: Upload macOS artifact
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: mcp/lab-skill-factory/dist/macos/lab-factory

      - name: Upload Windows artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            mcp/lab-skill-factory/dist/windows/lab-factory.exe
            mcp/lab-skill-factory/dist/windows/installer/*.exe
