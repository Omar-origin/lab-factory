<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>管理员邀请 · Lab Factory</title><link rel="stylesheet" href="/assets/portal.css"><link rel="stylesheet" href="/control/control.css"></head><body data-control-page="invites"><div class="control-layout"><aside id="controlRail" class="control-rail"></aside><main class="control-main"><header class="control-head"><div><p class="eyebrow">CONTROL / ADMIN INVITES</p><h1>管理员邀请</h1><p>特殊邀请码只授予中控权限，不参与普通 20% 返佣。代码仅在生成时显示一次。</p></div></header><div class="control-grid"><section class="card control-panel"><h2>生成特殊邀请码</h2><form id="inviteForm"><label class="field"><span>授予身份</span><select name="role"><option value="distributor_admin">分销管理员</option><option value="owner">完全管理员</option></select></label><label class="field"><span>最大使用次数</span><input name="max_uses" type="number" min="1" max="100" value="1"></label><label class="field"><span>有效天数</span><input name="valid_days" type="number" min="1" max="90" value="7"></label><button class="button primary full">生成邀请码</button></form><div id="issuedInvite" class="issued-code" hidden><span>请立即保存，之后只显示尾号</span><code id="issuedInviteCode"></code><button id="copyIssuedInvite" class="button">复制邀请码</button></div></section><section class="card control-panel"><h2>安全说明</h2><p class="muted">邀请码使用后只授予指定角色。撤销邀请码不会自动撤销已经获得的管理员身份，需要在账号管理中单独调整。</p></section></div><div class="table-wrap" style="margin-top:18px"><table class="data-table"><thead><tr><th>代码尾号</th><th>角色</th><th>使用</th><th>状态</th><th>到期时间</th><th>操作</th></tr></thead><tbody id="inviteRows"></tbody></table></div></main></div><div id="toast" class="toast"></div><script src="/assets/portal.js"></script><script src="/control/control.js"></script></body></html>
