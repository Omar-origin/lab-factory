<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>订单管理 · Lab Factory</title><link rel="stylesheet" href="/assets/portal.css"><link rel="stylesheet" href="/control/control.css"></head><body data-control-page="orders"><div class="control-layout"><aside id="controlRail" class="control-rail"></aside><main class="control-main"><header class="control-head"><div><p class="eyebrow">CONTROL / ORDERS</p><h1>订单管理</h1><p>查看等待付款、核款、成功、取消、失效和退款订单。分销管理员只会看到自己渠道内的订单。</p></div></header><form id="orderFilters" class="control-toolbar card card-pad"><input id="orderSearch" placeholder="搜索订单号、邮箱或付款参考"><select id="orderPlanFilter"><option value="">全部套餐</option><option value="experience">体验版</option><option value="permanent">永久版</option><option value="team">五人共享版</option></select><select id="orderStatusFilter"><option value="">全部状态</option><option value="payment_pending">等待付款</option><option value="payment_submitted">等待核款</option><option value="delivered">成功交付</option><option value="cancelled">已取消</option><option value="expired">已失效</option><option value="refunded">已退款</option></select><button class="button primary">查询</button></form><div class="table-wrap" style="margin-top:18px"><table class="data-table"><thead><tr><th>订单</th><th>套餐</th><th>状态</th><th>实付</th><th>账号</th><th>创建时间</th><th>操作</th></tr></thead><tbody id="orderRows"></tbody></table></div></main></div><div id="toast" class="toast"></div><script src="/assets/portal.js"></script><script src="/control/control.js"></script></body></html>
