<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080b09"><meta name="description" content="登录 Lab Factory 用户中心。"><title>账号登录 · Lab Factory</title><link rel="stylesheet" href="/assets/portal.css"></head>
<body><main class="auth-page"><section class="auth-story" aria-label="产品介绍"><a class="brand" href="/showcase"><span class="brand-mark">LF</span><span>LAB FACTORY<small>LOCAL REPORT WORKBENCH</small></span></a><h1>回来继续，<br>你的<em>本地工作。</em></h1><div class="auth-points"><span>密码安全登录</span><span>报告材料不上云</span><span>授权与订单统一管理</span></div></section>
<section class="auth-panel"><div class="auth-box"><a class="brand" href="/showcase"><span class="brand-mark">LF</span><span>LAB FACTORY<small>ACCOUNT ACCESS</small></span></a><nav class="auth-switch" aria-label="账号入口"><a class="active" href="/login">登录</a><a href="/register">注册</a></nav><h2>账号登录</h2><p>使用注册邮箱和密码进入用户中心。</p><form id="loginForm"><label class="field"><span>邮箱地址</span><input name="email" type="email" autocomplete="email" required placeholder="name@example.com"></label><label class="field"><span>密码</span><input name="password" type="password" autocomplete="current-password" required minlength="8" maxlength="64" placeholder="输入你的密码"></label><div id="turnstileWidget" class="turnstile-slot" aria-label="人机验证"></div><p id="turnstileStatus" class="verify-status" data-state="pending">正在加载人机验证…</p><button id="loginButton" class="button primary full" type="submit" disabled>登录</button></form><p id="formMessage" class="form-message" role="alert"></p><p class="auth-foot">还没有账号？<a href="/register">创建账号</a><br>忘记密码请联系售后 QQ 群：923937311</p></div></section></main><script src="/assets/portal.js"></script><script src="/assets/turnstile.js"></script><script src="/login/login.js"></script></body></html>
