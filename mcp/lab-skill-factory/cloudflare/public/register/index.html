<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080b09"><meta name="description" content="注册 Lab Factory 用户账号。"><title>创建账号 · Lab Factory</title><link rel="stylesheet" href="/assets/portal.css"></head>
<body><main class="auth-page"><section class="auth-story register-story" aria-label="产品介绍"><a class="brand" href="/showcase"><span class="brand-mark">LF</span><span>LAB FACTORY<small>LOCAL REPORT WORKBENCH</small></span></a><h1>先建立身份，<br>再开始<em>本地工作。</em></h1><div class="auth-points"><span>邮箱验证</span><span>密码加密存储</span><span>邀请码自动归因</span></div></section>
<section class="auth-panel"><div class="auth-box"><a class="brand" href="/showcase"><span class="brand-mark">LF</span><span>LAB FACTORY<small>NEW ACCOUNT</small></span></a><nav class="auth-switch" aria-label="账号入口"><a href="/login">登录</a><a class="active" href="/register">注册</a></nav><div id="registerStep"><h2>创建账号</h2><p>设置登录密码，再通过邮箱验证码确认账号归属。</p><form id="registerForm"><label class="field"><span>邮箱地址</span><input name="email" type="email" autocomplete="email" required placeholder="name@example.com"></label><label class="field"><span>设置密码</span><input name="password" type="password" autocomplete="new-password" required minlength="8" maxlength="64" placeholder="至少 8 位，包含字母和数字"></label><label class="field"><span>确认密码</span><input name="confirm_password" type="password" autocomplete="new-password" required minlength="8" maxlength="64" placeholder="再次输入密码"></label><p class="field-note">密码要求：8–64 个字符，同时包含字母和数字。</p><label class="field"><span>邀请码 <small>选填</small></span><input id="inviteCodeInput" name="invite_code" maxlength="64" autocomplete="off" placeholder="普通邀请码或管理员邀请代码"></label><p class="field-note">通过邀请链接进入时会自动填写；邀请码确认后不可更换邀请人。</p><div id="turnstileWidget" class="turnstile-slot" aria-label="人机验证"></div><p id="turnstileStatus" class="verify-status" data-state="pending">正在加载人机验证…</p><button id="registerButton" class="button primary full" type="submit" disabled>发送注册验证码</button></form></div><div id="codeStep" hidden><h2>验证邮箱</h2><p>验证码已发送至 <strong id="sentEmail"></strong>，10 分钟内有效。</p><form id="codeForm"><label class="field"><span>六位验证码</span><input name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" minlength="6" maxlength="6" required placeholder="000000"></label><button id="verifyButton" class="button primary full" type="submit">完成注册</button><button id="backButton" class="button ghost full" type="button" style="margin-top:10px">返回修改</button></form></div><p id="formMessage" class="form-message" role="alert"></p><p class="auth-foot">已有账号？<a href="/login">直接登录</a></p></div></section></main><script src="/assets/portal.js"></script><script src="/assets/turnstile.js"></script><script src="/register/register.js"></script></body></html>
